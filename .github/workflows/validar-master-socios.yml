name: Validar gestão Master
on:
  pull_request:
    paths:
      - 'docs/seguranca/*master-socios*.sql'
      - 'supabase/functions/master-manage-admins/**'
      - 'src/features/master/**'
      - 'src/lib/growthAttribution.js'
      - 'src/components/AuthPage.jsx'
      - 'tests/growth-attribution.test.js'
      - '.github/workflows/validar-master-socios.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste_ci_descartavel
          POSTGRES_DB: avespet_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Regras de autorização e auditoria
        env:
          PGPASSWORD: teste_ci_descartavel
        run: psql -h localhost -U postgres -d avespet_teste -v ON_ERROR_STOP=1 -f docs/seguranca/teste-master-socios.sql

  growth-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar atribuição opcional de canais
        run: node --test tests/growth-attribution.test.js
