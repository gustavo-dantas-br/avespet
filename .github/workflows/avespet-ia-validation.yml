name: Validar Avespet IA (sem deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/avespet-ia/**"
      - "tests/avespet-ia*.test.js"
      - ".github/workflows/avespet-ia-validation.yml"
      - "src/App.jsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (somente leitura)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes do Avespet IA
        run: node --test tests/avespet-ia.test.js tests/avespet-ia-diario.test.js
      - name: Compilar aplicação
        run: npm run build
