name: Validar RLS Avespet IA (isolado)
on:
  pull_request:
    paths:
      - 'docs/sql/avespet-ia-*-proposta.sql'
      - 'tests/sql/avespet-ia-rls.sql'
      - '.github/workflows/avespet-ia-rls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: avespet_ia_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avespet_ia_rls_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Rodar SQL no banco descartável
        env:
          PGPASSWORD: local_test_only
        run: psql -h 127.0.0.1 -U postgres -d avespet_ia_rls_test -f tests/sql/avespet-ia-rls.sql
