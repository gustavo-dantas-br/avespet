name: Build Avespet

on:
  push:
    branches:
      - feature/central-aves-perdidas
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verificar renderizacao dos modulos do criador
        run: npm run test:painel
      - name: Testar vinculação de respostas do suporte
        run: node --test tests/master-support-replies.test.js
      - name: Build
        run: npm run build
