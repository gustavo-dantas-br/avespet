name: Validar genética Avespet

on:
  push:
    branches:
      - integration/genetica-sobre-producao
      - feature/agente-genetico-avespet
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  genetica:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes da genética
        run: npm run test:genetica
      - name: Compilar aplicação
        run: npm run build
